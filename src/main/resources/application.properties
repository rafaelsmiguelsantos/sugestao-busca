spring.application.name=sugestao-busca
server.port=8080

# Java 25: uma thread virtual por requisicao. O BFF nao faz conta, ele espera
# duas redes — e por isso que o ganho aparece aqui.
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------------------
# Solr
# ---------------------------------------------------------------------------
sugestao.solr.base-url=http://localhost:8983/solr
sugestao.solr.colecao=sugestoes

# ---------------------------------------------------------------------------
# Orcamento de tempo. Sao prazos por dependencia, nao timeouts de biblioteca:
# cada um tem caminho alternativo, e nenhum tem nova tentativa — a proxima tecla
# ja vem a caminho.
# ---------------------------------------------------------------------------
sugestao.prazo.solr-ms=18
sugestao.prazo.perfil-ms=8
sugestao.prazo.total-ms=30

# ---------------------------------------------------------------------------
# Regras da lista
# ---------------------------------------------------------------------------
sugestao.prefixo-minimo=2

# Teto do prefixo digitado. Nao e relevancia, e custo: o analisador de EdgeNGram
# roda sobre o texto da consulta a cada tecla. Passar do teto devolve lista
# vazia, igual a prefixo curto demais, e nunca erro — a caixa de busca nao
# recebe 400 deste servico.
sugestao.prefixo-maximo=80

sugestao.resultado-maximo=8
sugestao.candidatos-solr=20
sugestao.cota.historico=2
sugestao.cota.evento=1

# Tipos de documento que podem virar sugestao. O desenho escreve este filtro
# como "tipo:(consulta OR acao)"; o catalogo semeado marca produto e artigo de
# ajuda como "entidade", entao deixar esse tipo de fora apagaria a camada de
# catalogo inteira — justamente a que tem destino, vigencia e elegibilidade.
#
# "oferta" e o tipo de quem tem produto alvo e identificador: item semeado com
# produto, e tudo que entra por POST /v1/ofertas. Tirar este tipo da lista
# desliga a oferta da busca sem desligar o cadastro — o que e util para
# incidente, e e exatamente por isso que ele e parametro e nao constante.
sugestao.tipos-sugeriveis=consulta,acao,entidade,oferta

# ---------------------------------------------------------------------------
# CORS: o que um cliente React ou Angular precisa para chamar do navegador
#
# VAZIO significa NENHUMA origem autorizada, nao todas. Sem isto a API responde
# normal a curl e e BLOQUEADA pelo navegador — o 200 chega e o JavaScript nunca
# ve a resposta, porque faltam os cabecalhos Access-Control-*. Em DevTools isso
# aparece como erro de rede, o que manda investigar o lugar errado.
#
# Um "*" aqui funcionaria em todo lugar, inclusive em producao, e e assim que
# uma API interna passa a aceitar chamada de qualquer pagina da internet sem
# ninguem ter decidido isso. As origens de desenvolvimento estao no perfil
# 'local'.
sugestao.cors.origens=

# Por quanto tempo o navegador guarda a autorizacao do preflight.
#
# Os cabecalhos X-Cliente-* nao estao na lista segura do CORS, entao o navegador
# manda um OPTIONS antes de cada GET. Numa caixa de busca que consulta a cada
# tecla isso DOBRARIA o numero de requisicoes. Trocar os cabecalhos por query
# string nao resolveria: em producao a identidade vem no Authorization, que
# tambem exige preflight. O que resolve e este numero.
sugestao.cors.max-age-segundos=1800

# ---------------------------------------------------------------------------
# Disjuntor da porta de leitura
#
# O prazo e o disjuntor protegem coisas diferentes. O prazo protege a
# REQUISICAO: 18 ms e desiste, para quem digita nao esperar. O disjuntor protege
# a DEPENDENCIA e o processo: com o Solr fora, cada tecla ainda abre uma conexao
# TCP e espera o prazo vencer — dezenas de tentativas por segundo contra um host
# morto, cada uma segurando descritor e thread. O prazo faz a falha ser rapida;
# o disjuntor faz a falha ser BARATA.
#
# Entra como DECORADOR da porta, em ConfiguracaoDeSugestao. Dominio, caso de uso
# e CatalogoSolr nao sabem que ele existe.
#
# So na leitura. O cadastro de oferta e de volume baixo e tem alguem esperando
# resposta; a publicacao roda no agendador, que ja e o mecanismo de nova
# tentativa. O volume de teclas e o que justifica o disjuntor.
# ---------------------------------------------------------------------------
sugestao.disjuntor.habilitado=true

# Janela de amostras, e nao falhas consecutivas: consecutivas nunca abrem no
# caso que mais importa — uma dependencia que responde metade das vezes.
sugestao.disjuntor.janela=20
sugestao.disjuntor.limite-de-falhas=10

# Nao decide com amostra pequena. E o cenario do Solr recem-subido, onde as
# primeiras consultas estouram o prazo de 18 ms legitimamente.
sugestao.disjuntor.minimo-de-chamadas=10

# Quanto fica aberto antes de liberar sondas.
sugestao.disjuntor.espera-ms=5000

# Poucas sondas: o Solr volta frio, e devolver de uma vez toda a carga que
# estava sendo recusada e a forma mais comum de derruba-lo outra vez.
sugestao.disjuntor.sondas=2

# ---------------------------------------------------------------------------
# Seguranca: quem pode chamar o que
#
# Este servico e SERVIDOR DE RECURSO. Ele valida o token que chega e nao emite
# nenhum: emitir e papel do provedor de identidade, e um BFF que emite o proprio
# token e um BFF que decide quem ele mesmo e. Os tokens de desenvolvimento saem
# de scripts\gerar-token.ps1 — um script, FORA da aplicacao, para nao existir
# caminho de emissao no servico nem por acidente.
#
# Escopos:
#   sugestao:ler          GET  /v1/sugestoes
#   eventos:escrever      POST /v1/eventos
#   ofertas:escrever      POST /v1/ofertas
#   ofertas:ler           GET  /v1/ofertas/{id}
#   ofertas:todas         cadastrar em QUALQUER jornada (operacao e carga inicial)
#   aprendizado:executar  POST /v1/aprendizado/rodar
#
# O escopo diz que o chamador pode cadastrar ALGUMA coisa. A reivindicacao
# 'jornada' diz O QUE: a oferta tem de ser da jornada dele. Essa regra e de
# negocio e mora no caso de uso, nao aqui.
# ---------------------------------------------------------------------------
sugestao.seguranca.habilitada=true
sugestao.seguranca.emissor=https://sugestao-busca.dev

# VAZIO DE PROPOSITO, e a aplicacao NAO SOBE sem ele.
#
# E a escolha deliberadamente inconveniente. Um segredo padrao embutido
# funcionaria em qualquer lugar, inclusive em producao, e assinaria tokens que
# qualquer pessoa com acesso a este repositorio sabe forjar. Falhar na subida e
# ruidoso, acontece uma vez, e acontece para quem esta configurando — nao para
# quem esta sendo atacado.
#
# Em producao isto vem do cofre, nunca de arquivo. HS256 exige 32 bytes.
sugestao.seguranca.segredo=${SUGESTAO_SEGREDO:}

# ---------------------------------------------------------------------------
# Afinidade: como clique e adesao viram "esta pessoa se interessa por X"
#
# Clique vale 2 pontos, adesao vale 5, busca vale ZERO - quem procura entender
# um produto nao e quem o quer, e adesao e o unico destes sinais que o negocio
# reconhece como resultado.
#
# Estes tres numeros substituem duas decisoes que, isoladas, pareciam boas e,
# juntas, faziam o sistema acreditar rapido demais e nunca esquecer:
#
#   A afinidade era dividida pela jornada mais forte DA PROPRIA PESSOA. Com um
#   clique so, a mais forte E aquele clique: 2/2 = 1,0. UM clique acidental
#   punha a pessoa no teto de promocao da jornada.
#
#   E era substituida a cada rodada, o que apagava tudo quando a janela nao
#   tinha cliques - e depois passou a ser preservada, o que nunca esquecia.
# ---------------------------------------------------------------------------

# Quantos pontos valem afinidade maxima. Seis = tres cliques de hoje, ou uma
# adesao mais um clique. Um clique sozinho da 0,33, que no ranking e 1,17x:
# ruido, que e o que um clique e. Baixar faz o sistema acreditar mais rapido.
sugestao.aprendizado.afinidade.piso-de-confianca=6.0

# A velocidade do esquecimento. Sete dias: tres cliques de duas semanas atras
# valem 0,25 de afinidade, de um mes atras valem 0,05.
#
# O decaimento e por IDADE DO EVENTO, nunca por rodada. Por rodada parece
# natural e e armadilha: o agendador roda a cada 15 s, entao um fator por rodada
# esvaziaria a afinidade em minutos - e trocar o intervalo do agendador mudaria
# a velocidade do esquecimento, que e decisao de produto virando efeito colateral
# de configuracao de infraestrutura.
sugestao.aprendizado.afinidade.meia-vida-dias=7

# Quando parar de somar. Longa de proposito, e NAO e a mesma coisa que a
# meia-vida: interesse em credito imobiliario nao se demonstra todo dia, e
# cortar em 24 h chamaria de desinteresse o que e so intervalo entre acessos.
# A meia-vida ja tornou irrelevante o que e velho; a janela so evita somar isso.
sugestao.aprendizado.afinidade.janela-dias=90

# O piso do nivel do PRODUTO: 4,0, ou dois cliques de hoje.
#
# Mais baixo que o da jornada porque a evidencia e muito mais escassa. Ha meia
# duzia de jornadas e vinte e tantos produtos, e o clique se espalha: com piso
# 6,0 nos dois niveis, a afinidade por produto ficaria matematicamente correta e
# praticamente sempre zero - um recurso inerte que ninguem notaria estar inerte.
# O preco desta concessao e pago no teto menor em sugestao.peso.
sugestao.aprendizado.afinidade.piso-de-confianca-do-produto=4.0

# As duas janelas da tendencia, em dias.
#
# A meia-vida ja diz QUANTO a pessoa quer; a tendencia diz PARA ONDE isso vai -
# disparou esta semana ou e constante ha um mes, que e a diferenca entre
# necessidade transitoria e interesse duravel. Como a curta esta contida na
# longa, a razao vive em [0,1] e o ponto NEUTRO nao e 0,5: e 7/30 = 0,233.
sugestao.aprendizado.afinidade.tendencia-curta-dias=7
sugestao.aprendizado.afinidade.tendencia-longa-dias=30

# Pontos minimos na janela longa para a tendencia ser calculada; abaixo disto
# ela devolve neutro (1,0).
#
# Existe porque razao de numeros pequenos e ruido: com tres cliques no total, um
# clique a mais move a razao de 0,33 para 0,66. Um sinal de ruido e pior que
# sinal nenhum, porque ninguem desconfia dele. Quantas vezes a tendencia cai
# neste caso e observavel pela metrica - e e assim que se descobre se este
# recurso esta dizendo algo ou esta desligado de fato.
sugestao.aprendizado.afinidade.piso-da-tendencia=4.0

# ---------------------------------------------------------------------------
# Fadiga: exibir e nao clicar
# ---------------------------------------------------------------------------
# O unico sinal que REBAIXA. Existe porque, sem ele, o ranking so sabe concordar
# consigo mesmo: uma linha exibida quarenta vezes e nunca clicada nao perdia
# nada, porque o ctr do indice mede a POPULACAO e nao esta pessoa.
#
# Impressoes sem clique antes de qualquer penalidade. Cinco e o menor numero que
# nao e acidente: numa caixa de busca a linha aparece e desaparece a cada tecla,
# e uma a quatro impressoes podem ser uma unica sessao de digitacao em que a
# pessoa nem leu a lista.
#
# BAIXAR ISTO TEM UM EFEITO ESPECIFICO E RUIM: oferta nova recebe impressao, nao
# tem clique ainda, e penalizada, afunda, e nunca chega a receber clique. E o
# mesmo laco que o piso de confianca da afinidade corrige na direcao oposta.
sugestao.aprendizado.fadiga.impressoes-minimas=5

# Onde a fadiga chega ao teto. Entre o piso e aqui o crescimento e linear - nao
# ha motivo para ser outra coisa: a curva exponencial da afinidade existe porque
# la o eixo e tempo, e tempo tem meia-vida; aqui o eixo e contagem.
sugestao.aprendizado.fadiga.impressoes-para-o-teto=20

# NAO HA "fadiga-maxima" AQUI, E ISSO E DELIBERADO.
#
# Havia: 0,4 neste arquivo e 0,6 em sugestao.peso.fadiga-minima. Os dois se
# multiplicavam, e no teto o fator saia 1 - 0,4 x (1 - 0,6) = 0,84. Uma perda de
# 16%, que nao e o que nenhum dos dois numeros dizia - e foi uma verificacao de
# ponta a ponta esperando 0,6 e encontrando 0,84 que mostrou isso.
#
# "Quanto da penalidade se aplica" (0 a 1) e conta da fadiga; "qual e a
# penalidade" e uma decisao SO, em sugestao.peso.fadiga-minima. Dois tetos para
# a mesma coisa produzem um efeito que ninguem preve lendo a configuracao.

# A fadiga esquece. Ignorar uma oferta em marco nao deve pesar em outubro: a
# conta mudou, a necessidade mudou, e o unico registro disso e a data.
sugestao.aprendizado.fadiga.janela-dias=30

# Quantos termos cansados cabem no perfil de UMA pessoa.
#
# ESTE TETO EXISTE POR CAUSA DO CAMINHO DE LEITURA, NAO DO DE ESCRITA.
#
# A fadiga e o unico sinal do perfil indexado por TERMO: o historico tem teto de
# 20, a afinidade de jornada tem meia duzia de chaves, a de produto algumas
# dezenas. A fadiga ganha uma entrada por termo exibido cinco vezes e nunca
# clicado, e quem usa o app todo dia acumula indefinidamente.
#
# O problema nao e a memoria do agregador - e que o PERFIL E LIDO A CADA TECLA.
# Num volume de 100 mil requisicoes por minuto, cada quilobyte a mais no perfil e
# trafego multiplicado por isso. E num armazenamento de documento ha limite de
# tamanho de item que, alcancado, nao degrada: falha.
#
# 50 e generoso para o desenho atual: com cota de 8 linhas por busca, sao ~6
# buscas de termos distintos, e so entra termo com 5+ impressoes sem clique.
#
# Quantos perfis batem no teto sai em cada rodada de aprendizado
# (perfisNoTetoDeFadiga). Zero numa base grande significa teto folgado; a maioria
# significa que ele esta cortando sinal e o numero precisa de discussao.
sugestao.aprendizado.fadiga.tamanho-maximo=50

# Quanto o agendador espera para a PRIMEIRA rodada. Zero.
#
# Era igual ao intervalo, e isso dava uma janela cega de 15 s depois da subida:
# nesse intervalo nenhum perfil tinha afinidade calculada. Numa demonstracao
# parece defeito; em producao e o primeiro usuario do dia recebendo lista pior
# sem razao.
#
# O atraso existia para nao disparar rodada antes das dependencias subirem.
# Deixou de ser necessario quando a rodada passou a atualizar perfil ANTES de
# tocar o indice: com o Solr fora, a parte de vocabulario falha e o agendador a
# retoma, e a parte de perfil ja terá acontecido.
sugestao.aprendizado.atraso-inicial-ms=0

# ---------------------------------------------------------------------------
# Ranking
#
# Tres sinais em cima do score do indice, todos multiplicativos e todos so
# promovem. Para rebaixar existe a Peneira, que tambem diz por que.
# ---------------------------------------------------------------------------
# Quando uma jornada domina os candidatos, ela e a intencao que o prefixo
# revela. Quem digita "emprestim" quer contratar, nao entender.
sugestao.peso.jornada-lider=1.6

# Dentro da jornada que lidera, quem empurra produto vem antes do artigo de
# ajuda sobre ele.
sugestao.peso.produto-da-jornada=1.25

# Teto do ranking por comportamento do proprio cliente. Diferente do ctr e da
# taxa_adesao do indice, que sao agregados da populacao: este diz o que ESTA
# pessoa faz. O teto e baixo de proposito — afinidade reforca afinidade, e sem
# limite a lista vira bolha.
sugestao.peso.afinidade-maxima=1.5

# Teto da afinidade por PRODUTO. Menor que o da jornada, e de proposito.
#
# A afinidade por produto e o que distingue consignado de emprestimo dentro de
# "credito" - antes era impossivel, porque os dois sao a mesma jornada. Para ser
# alcancavel ela acredita com menos evidencia (dois cliques em vez de tres, ver
# piso-de-confianca-do-produto). Dar a ela o mesmo teto da jornada somaria as
# duas concessoes e faria dois cliques num produto valerem mais que tres numa
# jornada.
sugestao.peso.afinidade-de-produto-maxima=1.2

# Teto da tendencia (janela de 7 dias contra a de 30). O menor dos quatro, e o
# numero onde a desconfianca neste sinal fica escrita: razao entre duas janelas
# calculada sobre pouca evidencia e, na maioria dos casos, ruido. O piso em
# piso-da-tendencia e que decide quando ela vale; este decide quanto ela vale.
sugestao.peso.tendencia-maxima=1.15

# Teto do PRODUTO de todos os fatores de promocao.
#
# Declarado, e nao emergente. Antes o teto era 3,0 porque 1,6 x 1,25 x 1,5 da
# 3,0 - e esse numero nao estava escrito em lugar nenhum, entao acrescentar um
# fator mudava o maximo do sistema em silencio.
#
# 3,6 E NAO 3,0, E A DIFERENCA FOI ACHADA POR UM TESTE.
#
# Com 3,0, uma linha de jornada lider com produto e afinidade maxima de jornada
# JA ESTA no teto (1,6 x 1,25 x 1,5 = 3,0). A afinidade por PRODUTO entao
# multiplicava um valor que o limite cortava de volta: consignado e emprestimo
# saiam os dois em 3,0 e o desempate — o motivo de o sinal existir — nao
# acontecia. O recurso nao ficava fraco, ficava INERTE, e justamente para quem
# tem mais comportamento registrado.
#
# 3,6 = 1,6 x 1,25 x 1,5 x 1,2: os quatro fatores que precisam caber. A
# tendencia (1,15) fica acima e e cortada no topo, de proposito — no limite, o
# sinal de menos confianca e o primeiro a ser descartado.
sugestao.peso.fator-maximo=3.6

# Piso do fator de fadiga: o unico peso abaixo de 1 e o unico que rebaixa.
#
# 0,6 reordena sem enterrar - e o bastante para uma linha ignorada perder para
# uma linha nova de relevancia parecida, e insuficiente para ela cair atras de
# uma linha claramente pior. Em 0 ela removeria a linha sem dizer por que, que e
# trabalho da Peneira.
sugestao.peso.fadiga-minima=0.6

# Quanto a jornada do topo precisa superar a segunda para liderar. Empate nao
# elege ninguem: "limite" serve a cartao e a Pix, e escolher uma delas por
# diferenca de terceira casa decimal e inventar uma intencao.
sugestao.peso.margem-para-liderar=0.15

# ---------------------------------------------------------------------------
# Tolerancia a erro de digitacao
# ---------------------------------------------------------------------------
# Um interruptor so, e de proposito.
#
# Os dois numeros que governam a tolerancia - comprimento minimo de 5 e distancia
# por tamanho da palavra - sao decisoes de RELEVANCIA, que se discutem lendo
# ConsultaDeCandidatos. Expor um "distancia maxima" configuravel convidaria a
# subi-lo ate a busca passar a encontrar qualquer coisa, que e exatamente o modo
# de falha desta funcionalidade: com quatro letras, distancia 1 faz "card" casar
# "carro" e "cara".
#
# Desligar devolve o comportamento anterior: uma letra errada zera a lista.
sugestao.busca.tolerancia-habilitada=true

# ---------------------------------------------------------------------------
# Medicao da qualidade da busca
# ---------------------------------------------------------------------------
# Ligada por padrao: o custo e um contador em memoria, e o valor e a unica
# evidencia de que as mudancas de relevancia fizeram algo. Taxa de
# zero-resultado, desfecho em quatro valores, posicao clicada e motivo de
# descarte - ver MedidorDeBusca.
#
# Desligar troca o adaptador pelo MedidorDeBusca.NULO, e nao por um medidor que
# finge medir. A rota /actuator/metrics exige o escopo metricas:ler.
sugestao.medicao.habilitada=true

# ---------------------------------------------------------------------------
# Limite de taxa na rota de digitacao
# ---------------------------------------------------------------------------
# E DEFESA EM PROFUNDIDADE, NAO A CAMADA PRINCIPAL. O contador e por processo e
# em memoria: nao sobrevive a restart e nao e compartilhado entre instancias -
# com tres instancias atras de um balanceador, o limite efetivo e o triplo. A
# camada que resolve isso e o gateway, que ve todo o trafego.
sugestao.limite-de-taxa.habilitado=true

# 600 POR MINUTO E CALIBRADO PARA DEIXAR A PESSOA DIGITAR, nao para impedir
# raspagem do catalogo.
#
# Quem digita "financiamento imobiliario" rapido gasta ~25 requisicoes em
# segundos. Com debounce de 120 ms e cancelamento da anterior, um usuario real
# nao chega perto do teto.
#
# Os dois limites que separariam quem digita rapido de quem raspa devagar sao
# incompativeis: apertado o bastante para incomodar quem raspa quebra quem
# digita, e folgado o bastante para digitacao nao impede quem raspa com
# paciencia. Este numero protege a digitacao; o resto e deteccao de
# comportamento, nao contador.
sugestao.limite-de-taxa.por-minuto=600

# Teto de chaves rastreadas. SEM ELE O PROPRIO LIMITADOR E O VETOR: um atacante
# com tokens descartaveis faria o mapa crescer ate o processo cair, usando a
# defesa como ataque. No teto, o Caffeine despeja a chave menos usada - no pior
# caso um chamador ganha a contagem zerada, que e degradacao do limite e nao do
# processo.
sugestao.limite-de-taxa.teto-de-chaves=50000

# ---------------------------------------------------------------------------
# Observabilidade da decisao
# ---------------------------------------------------------------------------
# Liga o ?explicar=true, que devolve o rastro da decisao junto da lista.
#
# O default e false, e o perfil 'local' liga. A lista de descartes diz quais
# produtos o cliente nao pode contratar — e isso e informacao sobre a pessoa,
# nao sobre a busca. Um comentario dizendo "desligar em producao" ao lado de um
# default ligado protege quem le o arquivo, nao quem faz deploy sem ler.
sugestao.explicacao-habilitada=false

# O rastro de cada requisicao sai em DEBUG, sempre, independente do parametro.
logging.level.dev.sugestao.busca.adaptador.entrada.web=DEBUG

# ---------------------------------------------------------------------------
# Caminho de escrita: ingestao, agregacao e publicacao
#
# Nada aqui esta no orcamento de 30 ms. Sao os numeros do que roda fora da
# requisicao, com ninguem esperando.
# ---------------------------------------------------------------------------
# De quanto em quanto tempo o agendador consome a fila e republica. Em producao
# isto seria um job de stream; aqui e um relogio dentro do processo.
sugestao.aprendizado.intervalo-ms=15000

# As duas janelas do desenho. A do vocabulario e longa porque precisa juntar
# gente suficiente para o piso de k-anonimato fazer sentido. A do comportamento
# e curta porque gatilho que nao expira deixa de ser oportunidade.
sugestao.aprendizado.janela-vocabulario-dias=30
sugestao.aprendizado.janela-comportamento-horas=24

sugestao.aprendizado.tamanho-do-historico=20
sugestao.aprendizado.lote-de-consumo=5000

# Tetos de memoria do POC. Em producao quem segura isto e o MSK e o job de
# agregacao; aqui sao duas colecoes num processo so.
sugestao.aprendizado.teto-da-fila=50000
sugestao.aprendizado.teto-de-eventos=200000

# Prazo da escrita no indice. Nada a ver com os 18 ms da leitura: aqui ninguem
# esta esperando, e um update seguido de commit leva segundos. Um cliente Solr
# so, compartilhado entre os dois caminhos, fazia a publicacao estourar em 18 ms
# a cada rodada — em silencio, porque o agendador engole o erro e tenta de novo.
sugestao.aprendizado.publicacao-timeout-ms=30000

# Liga o POST /v1/aprendizado/rodar, que roda a agregacao na hora em vez de
# esperar o relogio. Default false, o perfil 'local' liga: e um gatilho que da
# para disparar em laco.
sugestao.aprendizado.gatilho-manual=false

# Piso de k-anonimato: numero minimo de clientes distintos que precisam ter
# digitado o termo antes de ele poder ser sugerido a qualquer pessoa.
# E o unico parametro deste arquivo que, se for afrouxado, vira incidente.
sugestao.k-anonimato-minimo=30

# ---------------------------------------------------------------------------
# Observabilidade
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
