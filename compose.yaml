# A infraestrutura de desenvolvimento da camada de sugestao: Solr e DynamoDB.
#
# ESTE COMENTARIO JA ESTEVE ERRADO. Ele afirmava que nenhum runtime de container
# existia nesta maquina. Passou a existir (Docker Desktop, instalado POR USUARIO
# em %LOCALAPPDATA%\Programs\DockerDesktop, fora do PATH) e o comentario ficou
# para tras por dois dias — o tipo de defeito de documentacao que custa uma
# decisao de arquitetura tomada sobre premissa vencida.
#
#   docker compose up -d
#   pwsh scripts/criar-colecao.ps1      # cria a colecao e aplica o schema
#   pwsh scripts/semear-vocabulario.ps1 # vocabulario sintetico + catalogo
#   docker compose down                 # mantem os volumes
#   docker compose down -v              # descarta indice E tabelas
#
# As tabelas do DynamoDB nao precisam de script: TabelasDoDynamo as cria na
# inicializacao (sugestao.dynamo.criar-tabelas, default true). ESTE COMENTARIO
# TAMBEM JA ESTEVE ERRADO: ele mandava rodar um 'scripts/criar-tabelas.ps1' que
# nunca existiu no repositorio.
#
# scripts/solr-local.ps1 continua subindo o mesmo Solr 10.0.0 a partir do zip, na
# mesma porta e com a mesma colecao, para quem nao quiser container -- mas ele
# NAO baixa nada: a instalacao tem de existir e ser apontada por SOLR_INSTALL.
# O schema e identico nos dois caminhos, e os dois sobem em SolrCloud. Nao suba
# os dois ao mesmo tempo na porta 8983.

services:
  solr:
    image: solr:10.0.0
    container_name: sugestao-solr
    ports:
      # So localhost. Expor 0.0.0.0 abriria o Solr para a rede e dispararia
      # o pedido de liberacao do firewall do Windows, que exige elevacao.
      - "127.0.0.1:8983:8983"
    environment:
      SOLR_HEAP: 1g
      # O modulo de reordenacao (camada 4 do desenho) fica disponivel desde ja,
      # mesmo que as camadas 1 a 3 subam primeiro.
      SOLR_MODULES: ltr
    # NAO usar 'solr-precreate'. Esse script da imagem termina com
    # 'exec solr-fg --user-managed', ou seja ele FORCA o modo autogerido -- e
    # nesse modo a API de colecoes responde 400 "Solr instance is not running
    # in SolrCloud mode", que e a UNICA API que scripts/criar-colecao.ps1 fala.
    # O caminho do container ficou quebrado desde que foi escrito, por isso.
    #
    # No Solr 10 'solr start' ja sobe em SolrCloud por padrao: a flag -c foi
    # removida e standalone virou opt-in via --user-managed. 'solr-foreground'
    # sem argumento e exatamente esse padrao. A colecao deixa de ser pre-criada
    # e passa a ser criada pelo criar-colecao.ps1, que e o dono do schema.
    command: ["solr-foreground"]
    volumes:
      - solr-data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/admin/info/system >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  dynamodb:
    image: amazon/dynamodb-local:3.0.0
    container_name: sugestao-dynamodb
    ports:
      # So localhost, pelo mesmo motivo do Solr.
      - "127.0.0.1:8000:8000"
    # -sharedDb poe tudo num arquivo so, em vez de um banco por par
    # (credencial, regiao). Sem isso, o token de dev e o script de criacao de
    # tabela enxergam BANCOS DIFERENTES, e o sintoma e
    # "ResourceNotFoundException" numa tabela que voce acabou de criar.
    #
    # -dbPath grava em disco. O default do dynamodb-local e EM MEMORIA, que
    # reintroduziria exatamente o problema que este servico existe para
    # resolver — e de forma silenciosa, porque tudo funciona ate o restart.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    working_dir: /home/dynamodblocal
    user: root
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      # A imagem nao tem curl. Este endpoint responde 400 a um GET sem
      # assinatura, e 400 ja prova que ha alguem escutando e falando o
      # protocolo — e o que um healthcheck precisa saber.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8000 && echo ok >&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  solr-data:
  dynamodb-data:
