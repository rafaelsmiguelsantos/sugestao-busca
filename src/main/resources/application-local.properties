# ---------------------------------------------------------------------------
# Perfil 'local': o que so pode existir nesta maquina.
#
#     .\mvnw spring-boot:run "-Dspring-boot.run.profiles=local"
#
# Tudo aqui esta DESLIGADO no application.properties de proposito. O default que
# viaja no repositorio e o seguro; ligar e uma decisao de quem roda, nao um
# descuido de quem faz deploy.
# ---------------------------------------------------------------------------

# Devolve o rastro da decisao em ?explicar=true. A lista de descartes diz quais
# produtos o cliente nao pode contratar: informacao sobre a pessoa, nao sobre a
# busca.
sugestao.explicacao-habilitada=true

# Roda a agregacao na hora, em vez de esperar os 15 s do agendador. Existe para
# a demonstracao; e um gatilho que da para disparar em laco.
sugestao.aprendizado.gatilho-manual=true

# Prazos folgados para demonstrar sem aquecer. Os numeros do desenho sao 18/8/30
# e estao no application.properties; num Solr recem-subido as primeiras
# consultas estouram isso e a lista volta vazia, que e o comportamento correto e
# atrapalha a demonstracao.
sugestao.prazo.solr-ms=250
sugestao.prazo.perfil-ms=100
sugestao.prazo.total-ms=400

# As portas de desenvolvimento dos tres empacotadores que um cliente React ou
# Angular usa: Create React App / Next, Angular CLI, e Vite. Por extenso, uma a
# uma, e nao um padrao com curinga — a lista e para ser lida e auditada, e um
# curinga em arquivo de configuracao sobrevive ao caminho para producao.
#
# 127.0.0.1 entra junto de localhost porque, para o CORS, as duas sao origens
# DIFERENTES: a comparacao e textual sobre (esquema, host, porta), nao por
# resolucao de nome. Quem abre o app por 127.0.0.1 tomaria bloqueio com apenas
# localhost na lista, e o erro no DevTools nao diz isso.
sugestao.cors.origens=http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173

# Segredo de desenvolvimento, em texto, no repositorio, de propósito: ele assina
# apenas tokens que valem contra este arquivo. Qualquer pessoa que leia o
# repositorio sabe forja-lo, e e exatamente por isso que ele NAO e o padrao do
# application.properties — la o segredo e vazio e a aplicacao recusa subir.
#
# Gere tokens com:  .\scripts\gerar-token.ps1 -Tipo cliente
sugestao.seguranca.segredo=SEGREDO-REMOVIDO-VER-SUGESTAO-SEGREDO
