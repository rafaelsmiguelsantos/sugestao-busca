# ---------------------------------------------------------------------------
# Cache de perfil por sessao de digitacao
# ---------------------------------------------------------------------------
# O PERFIL E LIDO A CADA TECLA, E ELE NAO MUDA ENTRE AS TECLAS.
#
# Quem digita "financiamento" gasta dez teclas, e sao dez leituras do mesmo
# dado: o que produz o perfil roda a cada 15 s, FORA da requisicao. Em 60
# milhoes de buscas por dia isso e uma multiplicacao por dez do acesso ao
# armazenamento de documento.
#
# O GANHO DE LATENCIA HOJE E ZERO, e dizer isso evita a conclusao errada. O
# perfil mora num ConcurrentHashMap neste processo, e ler mapa local nao custa o
# bastante para medir. O ganho de custo e na forma de producao, onde a porta vai
# a um DynamoDB.
#
# O QUE SE GANHA HOJE E ESTABILIDADE, e nao custo. A agregacao reescreve perfis a
# cada 15 s; uma rodada que caia no meio da digitacao pode reordenar a lista por
# um motivo sem relacao nenhuma com a letra que a pessoa acabou de digitar -
# afinidade recalculada, fadiga nova, tendencia que cruzou o piso. Com um
# instantaneo por sessao, "digitei uma letra e a lista embaralhou" deixa de ser
# possivel.
#
# Entra como DECORADOR da porta de LEITURA, em ConfiguracaoDeSugestao. A porta de
# escrita continua apontando direto para o adaptador. Dominio, caso de uso e
# PerfisEmMemoria nao sabem que ele existe - mesmo padrao do disjuntor.
#
# DESLIGADO POR PADRAO, E O MOTIVO FOI MEDIDO, NAO SUPOSTO.
#
# Com ele LIGADO, requisicoes\verificar-comportamento.ps1 falha em CINCO
# verificacoes: afinidade por produto, fadiga e o clique que zera a fadiga
# aparecem todos INERTES, com relevancia identica byte a byte antes e depois do
# aprendizado. Com ele desligado, as cinco passam.
#
# A causa nao e defeito do cache - e o que ele faz. Aquele script roda
# POST /v1/aprendizado/rodar e consulta NA LINHA SEGUINTE, e nenhum valor de TTL
# conserta isso: a segunda leitura acontece milissegundos depois da escrita.
# Mesma coisa em demonstrar.ps1, simular.ps1, sugestoes.http (7.3 -> 7.4) e na
# pasta 4 da collection de exploracao.
#
# EM PRODUCAO ESSE CAMINHO NAO EXISTE: o evento vai para a fila e a rodada roda a
# cada 15 s, entao o efeito de um clique ja demora ate 15 s para aparecer e mais
# 5 s de TTL e marginal. O caminho sincrono existe SO para a demonstracao - e e
# justamente ele que prova tres funcionalidades.
#
# Entao a regra deste repositorio se aplica: o default que viaja aqui e o seguro,
# e ligar e decisao de quem roda. O ganho que o cache entrega hoje
# (estabilidade dentro da digitacao) e argumento de papel; o custo e medido.
# Ligar vale quando a porta de perfil for rede de verdade - e aquele dia tem
# numero proprio, nao este.
#
# O CONSERTO CERTO NAO E TTL, e esta escrito em decisoes.md 27: a chave devia ser
# (cliente, sessao-de-digitacao), com o front mandando um identificador de sessao.
# Ai nao ha staleness entre sessoes e nao ha relogio nenhum na conta.
sugestao.cache-de-perfil.habilitado=false

# Cinco segundos: cobre uma palavra digitada e nao cobre uma sessao de uso.
#
# NAO HA INVALIDACAO POR ESCRITA, E ISSO E DELIBERADO. Seria facil - o decorador
# poderia implementar EscritorDePerfil e derrubar a chave de cada cliente que a
# agregacao tocou. Recusado porque isso DESFAZ o segundo beneficio para melhorar
# um terceiro que ninguem pediu: a invalidacao devolve exatamente a reordenacao
# no meio da digitacao que o cache existe para impedir.
#
# O preco e declarado: um clique agora nao zera a fadiga ate este TTL vencer. Com
# segundos contra sinais de janela de 30 e 90 dias, e indistinguivel de zero.
#
# O TETO DE 30 S E CODIGO, NAO CONSELHO: acima disso a aplicacao recusa subir
# (ver SugestaoProperties.CacheDePerfil). Um TTL de minutos esconderia a
# agregacao, e o sistema continuaria aprendendo e pararia de usar o que aprendeu
# sem erro em lugar nenhum.
sugestao.cache-de-perfil.ttl-ms=5000

# Teto de perfis guardados. Mesmo raciocinio do teto do limitador de taxa: sem
# ele, trafego com muitos clientes distintos faria o mapa crescer ate o processo
# cair. No teto o Caffeine despeja o menos usado, e o pior caso e uma leitura a
# mais - degradacao do cache, nao do processo.
#
# A taxa de acerto sai em sugestao.perfil.cache.acertos / .erros. Baixa significa
# TTL curto demais para a velocidade real de digitacao, OU teto despejando antes
# de o TTL vencer - duas causas com consertos diferentes, e e por isso que os
# numeros saem separados.
sugestao.cache-de-perfil.teto-de-chaves=50000

# ---------------------------------------------------------------------------
# DynamoDB: o registro de perfil e o log duravel de eventos
# ---------------------------------------------------------------------------
# DESLIGADO AQUI, e pela terceira vez a mesma regra: o default que viaja no
# repositorio e o que funciona sem infraestrutura extra. Com false, os
# adaptadores em memoria continuam atendendo as portas e nada no dominio percebe
# - que e precisamente o que esta implementacao existe para demonstrar.
#
# O perfil-alvo e 'local', e la ele vem LIGADO (application-local.properties).
#
# O QUE MUDA QUANDO LIGA, e por que isto nao e so durabilidade:
#
#   1. O perfil deixa de morrer no restart. Hoje reiniciar apaga afinidade,
#      tendencia, fadiga e historico dos oito perfis, e a demonstracao precisa
#      ser "aquecida" antes de mostrar comportamento.
#
#   2. O log de eventos passa a ACUMULAR. E o passo 1 de proximos-passos.md, e
#      nada de aprendizado de maquina comeca antes dele: hoje existe um caminho
#      de aprendizado que funciona e esquece tudo a cada deploy.
#
#   3. Os tres mecanismos de resiliencia passam a proteger algo real. Prazo de
#      8 ms, disjuntor e cache guardavam um ConcurrentHashMap, que nao consegue
#      ser lento nem falhar. Estavam corretos e sem nada para fazer.
sugestao.dynamo.habilitado=false

# Vazio usa a resolucao normal do SDK (producao). Para o DynamoDB Local,
# http://localhost:8000 - e nesse caso o adaptador tambem injeta credencial
# estatica falsa, porque o emulador aceita qualquer uma mas o SDK EXIGE que
# exista uma para assinar.
sugestao.dynamo.endpoint=
sugestao.dynamo.regiao=sa-east-1

# Uma tabela para o perfil e uma para o log. Nao e uma so por preguica de
# modelar: o log e append-only com TTL de 90 dias, o perfil e mutavel e sem TTL
# nenhum - elegibilidade nao expira porque o cliente parou de buscar.
sugestao.dynamo.tabela-de-perfis=sugestao-perfis
sugestao.dynamo.tabela-de-eventos=sugestao-eventos

# Cria as tabelas na inicializacao. E conveniencia de desenvolvimento, e esta
# declarado como tal: em producao tabela e infraestrutura, nasce de Terraform ou
# CDK, e a aplicacao nao deveria ter permissao de CreateTable em lugar nenhum.
sugestao.dynamo.criar-tabelas=true

# LEITURA FORTEMENTE CONSISTENTE, e a escolha merece o paragrafo.
#
# A leitura eventual custa METADE em RCU e seria o certo para um typeahead em
# producao. Mas ela reintroduz, agora na infraestrutura, o mesmo read-after-write
# que obrigou o cache de perfil a nascer desligado: a rodada de aprendizado grava
# e a busca seguinte pode nao ver.
#
# E O DYNAMODB LOCAL NAO REPRODUZ ESSE PROBLEMA. Ele e um processo so, sem
# replicacao, e responde de forma efetivamente consistente mesmo quando pedimos o
# contrario. Entao verificar-comportamento.ps1 passar aqui NAO PROVA que passaria
# contra o DynamoDB de verdade com leitura eventual. Limitacao do simulador,
# declarada, e o motivo de o default ser o seguro em vez do barato.
sugestao.dynamo.leitura-consistente=true

# TTL do log. O DynamoDB apaga de graca pelo atributo expiraEm, e isso tira do
# caminho o crescimento sem limite - sem consertar a agregacao, que continua
# recomputando a janela inteira a cada rodada (limitacao declarada).
sugestao.dynamo.retencao-de-eventos-dias=90

# Prazo da chamada. NAO E O PRAZO DO PERFIL, que e 8 ms e vive em
# sugestao.prazo.perfil-ms - este e o do cliente HTTP do SDK, e existe porque o
# caso de uso avisa que "o que transforma o prazo em ficcao sao duas coisas
# juntas: o cancelamento com interrupcao, e o timeout de requisicao configurado
# no proprio cliente do adaptador".
#
# Sem ele, o aguardar() desiste em 8 ms e devolve a lista degradada enquanto a
# thread virtual segue presa esperando o DynamoDB ate o default do SDK, que e de
# segundos. O TETO DE 1000 MS E CODIGO: acima disso a aplicacao recusa subir.
sugestao.dynamo.timeout-ms=200

# ---------------------------------------------------------------------------
# Limite de taxa na rota de digitacao
# ---------------------------------------------------------------------------
# E DEFESA EM PROFUNDIDADE, NAO A CAMADA PRINCIPAL. O contador e por processo e
# em memoria: nao sobrevive a restart e nao e compartilhado entre instancias -
# com tres instancias atras de um balanceador, o limite efetivo e o triplo. A
# camada que resolve isso e o gateway, que ve todo o trafego.
sugestao.limite-de-taxa.habilitado=true

# 600 POR MINUTO E CALIBRADO PARA DEIXAR A PESSOA DIGITAR, nao para impedir
# raspagem do catalogo.
#
# Quem digita "financiamento imobiliario" rapido gasta ~25 requisicoes em
# segundos. Com debounce de 120 ms e cancelamento da anterior, um usuario real
# nao chega perto do teto.
#
# Os dois limites que separariam quem digita rapido de quem raspa devagar sao
# incompativeis: apertado o bastante para incomodar quem raspa quebra quem
# digita, e folgado o bastante para digitacao nao impede quem raspa com
# paciencia. Este numero protege a digitacao; o resto e deteccao de
# comportamento, nao contador.
sugestao.limite-de-taxa.por-minuto=600

# Teto de chaves rastreadas. SEM ELE O PROPRIO LIMITADOR E O VETOR: um atacante
# com tokens descartaveis faria o mapa crescer ate o processo cair, usando a
# defesa como ataque. No teto, o Caffeine despeja a chave menos usada - no pior
# caso um chamador ganha a contagem zerada, que e degradacao do limite e nao do
# processo.
sugestao.limite-de-taxa.teto-de-chaves=50000

# ---------------------------------------------------------------------------
# Observabilidade da decisao
# ---------------------------------------------------------------------------
# Liga o ?explicar=true, que devolve o rastro da decisao junto da lista.
#
# O default e false, e o perfil 'local' liga. A lista de descartes diz quais
# produtos o cliente nao pode contratar — e isso e informacao sobre a pessoa,
# nao sobre a busca. Um comentario dizendo "desligar em producao" ao lado de um
# default ligado protege quem le o arquivo, nao quem faz deploy sem ler.
sugestao.explicacao-habilitada=false

# O rastro de cada requisicao sai em DEBUG, sempre, independente do parametro.
logging.level.dev.sugestao.busca.adaptador.entrada.web=DEBUG

# ---------------------------------------------------------------------------
# Caminho de escrita: ingestao, agregacao e publicacao
#
# Nada aqui esta no orcamento de 30 ms. Sao os numeros do que roda fora da
# requisicao, com ninguem esperando.
# ---------------------------------------------------------------------------
# De quanto em quanto tempo o agendador consome a fila e republica. Em producao
# isto seria um job de stream; aqui e um relogio dentro do processo.
sugestao.aprendizado.intervalo-ms=15000

# As duas janelas do desenho. A do vocabulario e longa porque precisa juntar
# gente suficiente para o piso de k-anonimato fazer sentido. A do comportamento
# e curta porque gatilho que nao expira deixa de ser oportunidade.
sugestao.aprendizado.janela-vocabulario-dias=30
sugestao.aprendizado.janela-comportamento-horas=24

sugestao.aprendizado.tamanho-do-historico=20
sugestao.aprendizado.lote-de-consumo=5000

# Tetos de memoria do POC. Em producao quem segura isto e o MSK e o job de
# agregacao; aqui sao duas colecoes num processo so.
sugestao.aprendizado.teto-da-fila=50000
sugestao.aprendizado.teto-de-eventos=200000

# Prazo da escrita no indice. Nada a ver com os 18 ms da leitura: aqui ninguem
# esta esperando, e um update seguido de commit leva segundos. Um cliente Solr
# so, compartilhado entre os dois caminhos, fazia a publicacao estourar em 18 ms
# a cada rodada — em silencio, porque o agendador engole o erro e tenta de novo.
sugestao.aprendizado.publicacao-timeout-ms=30000

# Liga o POST /v1/aprendizado/rodar, que roda a agregacao na hora em vez de
# esperar o relogio. Default false, o perfil 'local' liga: e um gatilho que da
# para disparar em laco.
sugestao.aprendizado.gatilho-manual=false

# Piso de k-anonimato: numero minimo de clientes distintos que precisam ter
# digitado o termo antes de ele poder ser sugerido a qualquer pessoa.
# E o unico parametro deste arquivo que, se for afrouxado, vira incidente.
sugestao.k-anonimato-minimo=30

# ---------------------------------------------------------------------------
# Observabilidade
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
