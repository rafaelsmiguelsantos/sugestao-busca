# ---------------------------------------------------------------------------
# Perfil 'teste'. Ativado por @ActiveProfiles("teste").
#
# POR QUE NAO 'application.properties'
#
# Um src\test\resources\application.properties SUBSTITUI o do src\main inteiro -
# mesmo nome, e o classpath de teste ganha. Ele nao soma. A primeira tentativa
# deste arquivo foi exatamente essa, e o contexto quebrou com
# NullPointerException em sugestao.aprendizado: todas as propriedades do main
# tinham desaparecido, e so a unica que este arquivo declarava existia.
#
# Arquivo de PERFIL (application-<perfil>.properties) e aditivo: ele entra em
# cima da base, sobrescrevendo o que declara e preservando o resto. E por isso
# que o perfil 'local' sempre funcionou do mesmo jeito.
#
# POR QUE ESTE ARQUIVO EXISTE
#
# O application.properties de producao tem o segredo VAZIO de proposito, e a
# aplicacao recusa subir sem ele. O teste de contexto passou a falhar no momento
# em que a seguranca entrou - exatamente como falharia um deploy sem segredo
# configurado, que e o ponto. Entao o segredo de teste mora aqui, visivelmente
# falso, e nao no padrao.
# ---------------------------------------------------------------------------
sugestao.seguranca.habilitada=true
sugestao.seguranca.segredo=segredo-de-teste-sem-nenhum-valor-fora-daqui
sugestao.seguranca.emissor=https://teste.sugestao-busca.dev

# O teste de contexto nao fala com o Solr; ele so confere que o grafo de beans
# fecha. Prazos folgados evitam que uma maquina lenta vire intermitencia.
sugestao.prazo.solr-ms=2000
sugestao.prazo.perfil-ms=2000
sugestao.prazo.total-ms=3000
