spring.application.name=sugestao-busca
server.port=8080

# Java 25: uma thread virtual por requisicao. O BFF nao faz conta, ele espera
# duas redes — e por isso que o ganho aparece aqui.
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------------------
# Solr
# ---------------------------------------------------------------------------
sugestao.solr.base-url=http://localhost:8983/solr
sugestao.solr.colecao=sugestoes

# ---------------------------------------------------------------------------
# Orcamento de tempo. Sao prazos por dependencia, nao timeouts de biblioteca:
# cada um tem caminho alternativo, e nenhum tem nova tentativa — a proxima tecla
# ja vem a caminho.
# ---------------------------------------------------------------------------
sugestao.prazo.solr-ms=18
sugestao.prazo.perfil-ms=8
sugestao.prazo.total-ms=30

# ---------------------------------------------------------------------------
# Regras da lista
# ---------------------------------------------------------------------------
sugestao.prefixo-minimo=2

# Teto do prefixo digitado. Nao e relevancia, e custo: o analisador de EdgeNGram
# roda sobre o texto da consulta a cada tecla. Passar do teto devolve lista
# vazia, igual a prefixo curto demais, e nunca erro — a caixa de busca nao
# recebe 400 deste servico.
sugestao.prefixo-maximo=80

sugestao.resultado-maximo=8
sugestao.candidatos-solr=20
sugestao.cota.historico=2
sugestao.cota.evento=1

# Tipos de documento que podem virar sugestao. O desenho escreve este filtro
# como "tipo:(consulta OR acao)"; o catalogo semeado marca produto e artigo de
# ajuda como "entidade", entao deixar esse tipo de fora apagaria a camada de
# catalogo inteira — justamente a que tem destino, vigencia e elegibilidade.
#
# "oferta" e o tipo de quem tem produto alvo e identificador: item semeado com
# produto, e tudo que entra por POST /v1/ofertas. Tirar este tipo da lista
# desliga a oferta da busca sem desligar o cadastro — o que e util para
# incidente, e e exatamente por isso que ele e parametro e nao constante.
sugestao.tipos-sugeriveis=consulta,acao,entidade,oferta

# ---------------------------------------------------------------------------
# CORS: o que um cliente React ou Angular precisa para chamar do navegador
#
# VAZIO significa NENHUMA origem autorizada, nao todas. Sem isto a API responde
# normal a curl e e BLOQUEADA pelo navegador — o 200 chega e o JavaScript nunca
# ve a resposta, porque faltam os cabecalhos Access-Control-*. Em DevTools isso
# aparece como erro de rede, o que manda investigar o lugar errado.
#
# Um "*" aqui funcionaria em todo lugar, inclusive em producao, e e assim que
# uma API interna passa a aceitar chamada de qualquer pagina da internet sem
# ninguem ter decidido isso. As origens de desenvolvimento estao no perfil
# 'local'.
sugestao.cors.origens=

# Por quanto tempo o navegador guarda a autorizacao do preflight.
#
# Os cabecalhos X-Cliente-* nao estao na lista segura do CORS, entao o navegador
# manda um OPTIONS antes de cada GET. Numa caixa de busca que consulta a cada
# tecla isso DOBRARIA o numero de requisicoes. Trocar os cabecalhos por query
# string nao resolveria: em producao a identidade vem no Authorization, que
# tambem exige preflight. O que resolve e este numero.
sugestao.cors.max-age-segundos=1800

# ---------------------------------------------------------------------------
# Disjuntor da porta de leitura
#
# O prazo e o disjuntor protegem coisas diferentes. O prazo protege a
# REQUISICAO: 18 ms e desiste, para quem digita nao esperar. O disjuntor protege
# a DEPENDENCIA e o processo: com o Solr fora, cada tecla ainda abre uma conexao
# TCP e espera o prazo vencer — dezenas de tentativas por segundo contra um host
# morto, cada uma segurando descritor e thread. O prazo faz a falha ser rapida;
# o disjuntor faz a falha ser BARATA.
#
# Entra como DECORADOR da porta, em ConfiguracaoDeSugestao. Dominio, caso de uso
# e CatalogoSolr nao sabem que ele existe.
#
# So na leitura. O cadastro de oferta e de volume baixo e tem alguem esperando
# resposta; a publicacao roda no agendador, que ja e o mecanismo de nova
# tentativa. O volume de teclas e o que justifica o disjuntor.
# ---------------------------------------------------------------------------
sugestao.disjuntor.habilitado=true

# Janela de amostras, e nao falhas consecutivas: consecutivas nunca abrem no
# caso que mais importa — uma dependencia que responde metade das vezes.
sugestao.disjuntor.janela=20
sugestao.disjuntor.limite-de-falhas=10

# Nao decide com amostra pequena. E o cenario do Solr recem-subido, onde as
# primeiras consultas estouram o prazo de 18 ms legitimamente.
sugestao.disjuntor.minimo-de-chamadas=10

# Quanto fica aberto antes de liberar sondas.
sugestao.disjuntor.espera-ms=5000

# Poucas sondas: o Solr volta frio, e devolver de uma vez toda a carga que
# estava sendo recusada e a forma mais comum de derruba-lo outra vez.
sugestao.disjuntor.sondas=2

# ---------------------------------------------------------------------------
# Ranking
#
# Tres sinais em cima do score do indice, todos multiplicativos e todos so
# promovem. Para rebaixar existe a Peneira, que tambem diz por que.
# ---------------------------------------------------------------------------
# Quando uma jornada domina os candidatos, ela e a intencao que o prefixo
# revela. Quem digita "emprestim" quer contratar, nao entender.
sugestao.peso.jornada-lider=1.6

# Dentro da jornada que lidera, quem empurra produto vem antes do artigo de
# ajuda sobre ele.
sugestao.peso.produto-da-jornada=1.25

# Teto do ranking por comportamento do proprio cliente. Diferente do ctr e da
# taxa_adesao do indice, que sao agregados da populacao: este diz o que ESTA
# pessoa faz. O teto e baixo de proposito — afinidade reforca afinidade, e sem
# limite a lista vira bolha.
sugestao.peso.afinidade-maxima=1.5

# Quanto a jornada do topo precisa superar a segunda para liderar. Empate nao
# elege ninguem: "limite" serve a cartao e a Pix, e escolher uma delas por
# diferenca de terceira casa decimal e inventar uma intencao.
sugestao.peso.margem-para-liderar=0.15

# ---------------------------------------------------------------------------
# Observabilidade da decisao
# ---------------------------------------------------------------------------
# Liga o ?explicar=true, que devolve o rastro da decisao junto da lista.
#
# O default e false, e o perfil 'local' liga. A lista de descartes diz quais
# produtos o cliente nao pode contratar — e isso e informacao sobre a pessoa,
# nao sobre a busca. Um comentario dizendo "desligar em producao" ao lado de um
# default ligado protege quem le o arquivo, nao quem faz deploy sem ler.
sugestao.explicacao-habilitada=false

# O rastro de cada requisicao sai em DEBUG, sempre, independente do parametro.
logging.level.dev.sugestao.busca.adaptador.entrada.web=DEBUG

# ---------------------------------------------------------------------------
# Caminho de escrita: ingestao, agregacao e publicacao
#
# Nada aqui esta no orcamento de 30 ms. Sao os numeros do que roda fora da
# requisicao, com ninguem esperando.
# ---------------------------------------------------------------------------
# De quanto em quanto tempo o agendador consome a fila e republica. Em producao
# isto seria um job de stream; aqui e um relogio dentro do processo.
sugestao.aprendizado.intervalo-ms=15000

# As duas janelas do desenho. A do vocabulario e longa porque precisa juntar
# gente suficiente para o piso de k-anonimato fazer sentido. A do comportamento
# e curta porque gatilho que nao expira deixa de ser oportunidade.
sugestao.aprendizado.janela-vocabulario-dias=30
sugestao.aprendizado.janela-comportamento-horas=24

sugestao.aprendizado.tamanho-do-historico=20
sugestao.aprendizado.lote-de-consumo=5000

# Tetos de memoria do POC. Em producao quem segura isto e o MSK e o job de
# agregacao; aqui sao duas colecoes num processo so.
sugestao.aprendizado.teto-da-fila=50000
sugestao.aprendizado.teto-de-eventos=200000

# Prazo da escrita no indice. Nada a ver com os 18 ms da leitura: aqui ninguem
# esta esperando, e um update seguido de commit leva segundos. Um cliente Solr
# so, compartilhado entre os dois caminhos, fazia a publicacao estourar em 18 ms
# a cada rodada — em silencio, porque o agendador engole o erro e tenta de novo.
sugestao.aprendizado.publicacao-timeout-ms=30000

# Liga o POST /v1/aprendizado/rodar, que roda a agregacao na hora em vez de
# esperar o relogio. Default false, o perfil 'local' liga: e um gatilho que da
# para disparar em laco.
sugestao.aprendizado.gatilho-manual=false

# Piso de k-anonimato: numero minimo de clientes distintos que precisam ter
# digitado o termo antes de ele poder ser sugerido a qualquer pessoa.
# E o unico parametro deste arquivo que, se for afrouxado, vira incidente.
sugestao.k-anonimato-minimo=30

# ---------------------------------------------------------------------------
# Observabilidade
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
